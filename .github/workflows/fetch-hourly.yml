name: fetch-hourly
on:
  schedule:
    # Googleトレンドの急上昇RSSは直近1時間ほどの10件しか返らないため毎時取得する。毎時0分は混雑するので37分
    - cron: '37 * * * *'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch.ts
        env:
          INGEST_URL: https://find-buzz.youth1975.workers.dev/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SOURCES: googletrends
