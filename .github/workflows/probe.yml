name: probe-apple-rss
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for f in topfreeapplications topgrossingapplications; do
            for g in "" /genre=6014 /genre=6005 /genre=6016 /genre=6008 /genre=6007 /genre=6012 /genre=6017 /genre=6024; do
              code=$(curl -s -o /dev/null -w "%{http_code}" "https://itunes.apple.com/jp/rss/$f/limit=100$g/json?t=$(date +%s%N)")
              echo "$f$g $code"
            done
          done
          curl -s -o /dev/null -w "new-rss %{http_code}\n" "https://rss.marketingtools.apple.com/api/v2/jp/apps/top-free/100/apps.json?t=$(date +%s)"
