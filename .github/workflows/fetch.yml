name: fetch
# 起動はCloudflare WorkerのCron Triggersからworkflow_dispatchで行う(wrangler.jsonc)
on:
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch.ts
        env:
          INGEST_URL: https://find-buzz.youth1975.workers.dev/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          SOURCES: appstore,hatena,zenn,hn,github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
