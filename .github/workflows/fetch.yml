name: fetch-appstore
on:
  schedule:
    - cron: '0 3,9,15,21 * * *' # JST 0/6/12/18時
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch-appstore.ts
        env:
          INGEST_URL: https://find-buzz.youth1975.workers.dev/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
