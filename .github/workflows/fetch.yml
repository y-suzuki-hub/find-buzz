name: fetch
on:
  schedule:
    # 毎時0分は混雑して数時間遅れる・飛ばされることがあるため17分にずらす。5:17の回は7:30の通知に間に合わせる用
    - cron: '17 2,8,14,20 * * *' # JST 5:17/11:17/17:17/23:17
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fetch.ts
        env:
          INGEST_URL: https://find-buzz.youth1975.workers.dev/ingest
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
